; CYD News - firmware for the "Cheap Yellow Display" (ESP32-2432S028R)
;
;   pio run -t upload               <- default: cyd-st7789 (CYDs with two USB ports / ST7789)
;   pio run -e cyd -t upload        <- single-USB-port CYDs (ILI9341)
;   pio device monitor              <- serial log

[platformio]
default_envs = cyd-st7789

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bodmer/TJpg_Decoder@^1.1.0
    bblanchon/ArduinoJson@^7.0.0
    paulstoffregen/XPT2046_Touchscreen

; TFT_eSPI is configured entirely from here, so no library files need editing.
build_flags =
    -DUSER_SETUP_LOADED=1
    -DUSE_HSPI_PORT=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

[env:cyd]
build_flags =
    ${env.build_flags}
    -DILI9341_2_DRIVER=1

[env:cyd-st7789]
build_flags =
    ${env.build_flags}
    -DST7789_DRIVER=1
    -DTFT_INVERSION_OFF=1
