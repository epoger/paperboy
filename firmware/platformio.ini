; CYD News - firmware for small ESP32 touch displays.
;
; Boards (one environment each):
;   cyd                "Cheap Yellow Display" ESP32-2432S028R, 2.8" 240x320 (default)
;   cyd-st7789         CYD variant with an ST7789 panel (try if `cyd` stays white)
;   watch-amoled206    Waveshare ESP32-S3-Touch-AMOLED-2.06, 410x502 AMOLED
;
;   pio run -t upload                     <- default board (cyd)
;   pio run -e watch-amoled206 -t upload  <- the watch
;   pio device monitor                    <- serial log

[platformio]
default_envs = cyd

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

[common]
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    bodmer/TJpg_Decoder@^1.1.0

; ----------------------------------------------------------------------------
;  CYD (ESP32-2432S028R)
; ----------------------------------------------------------------------------
; TFT_eSPI is configured entirely from here, so no library files need editing.
[cyd_base]
board = esp32dev
upload_speed = 460800
build_src_filter = +<*> -<hal_amoled206.cpp>
lib_deps =
    ${common.lib_deps}
    bodmer/TFT_eSPI@^2.5.43
    paulstoffregen/XPT2046_Touchscreen
build_flags =
    -DBOARD_CYD=1
    -DUSER_SETUP_LOADED=1
    -DUSE_HSPI_PORT=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

[env:cyd]
extends = cyd_base
build_flags =
    ${cyd_base.build_flags}
    -DILI9341_2_DRIVER=1
    -DTFT_INVERSION_OFF=1

; Diagnostic: shows five colour bars (red, green, blue, white, black) and stops.
[env:cyd-colortest]
extends = env:cyd
build_flags =
    ${env:cyd.build_flags}
    -DCOLOR_TEST=1

[env:cyd-st7789]
extends = cyd_base
build_flags =
    ${cyd_base.build_flags}
    -DST7789_DRIVER=1
    -DTFT_INVERSION_OFF=1

; ----------------------------------------------------------------------------
;  Waveshare ESP32-S3-Touch-AMOLED-2.06  (410x502 AMOLED, QSPI CO5300 + FT3168 touch)
;  8 MB octal PSRAM, 32 MB flash, native USB (serial over USB-CDC).
; ----------------------------------------------------------------------------
[env:watch-amoled206]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 32MB
board_build.partitions = default_16MB.csv
upload_speed = 921600
build_src_filter = +<*> -<hal_cyd.cpp>
lib_deps =
    ${common.lib_deps}
    moononournation/GFX Library for Arduino@^1.6.0
build_flags =
    -DBOARD_AMOLED206=1
    -DBOARD_HAS_PSRAM=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
